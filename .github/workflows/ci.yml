name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "./collector[dev]"
      - run: pytest collector/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: app
        run: |
          npm ci
          npm test
          npm run build
