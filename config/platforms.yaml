# Platform names, normalization and display.
#   aliases:     names collectors may report (matched case-insensitively)
#   kind:        default availability when a source doesn't say
#                (subscription, free, ads, early_access, paid, tv)
#   search_url:  used for the Watch button when a record has no direct link ({q} = title)
#   color:       chip color in the app

netflix:
  name: Netflix
  aliases: ["netflix", "netflix basic with ads", "netflix standard with ads"]
  kind: subscription
  search_url: "https://www.netflix.com/search?q={q}"
  color: "#e50914"
